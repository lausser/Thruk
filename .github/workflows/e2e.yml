name: e2e

# The E2E scenarios (t/610-scenario-*_e2e.t) are skipped in citest unless THRUK_TEST_E2E is set.
# This workflow runs each of them as its own job, with the same machine setup as citest,
# as the baseline for the playwright-e2e branch.

on:
  push:
    branches: [ master-e2e ]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - backend_icinga2_restapi_e2e
          - bp_sync_e2e
          - cluster_e2e
          - cluster_fixed_e2e
          - cookie_auth_ldap_e2e
          - lmd_federation_e2e
          - lmd_federation_multitier_e2e
          - logfile_cache_icinga2_ido_e2e
          - omd_debian_e2e
          - showcase_e2e
          - site_menu_multi_tier_e2e
          - umbrella_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: abbbi/github-actions-tune@v1

      - name: prepare machine
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 40
          retry_wait_seconds: 180
          command: |
            timeout -v 10m sudo bash -x ./.ci/prepare_machine.sh

      - name: install dependencies
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 40
          retry_wait_seconds: 180
          command: |
            chmod o+x /home/runner/
            timeout -v 10m sudo su naemon -c 'bash -x ./.ci/install_deps.sh'

      - name: install browser
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 30
          retry_wait_seconds: 180
          command: |
            timeout -v 5m sudo bash -x ./script/install_browser.sh

      - name: free some disk space
        run: |
            timeout -v 15m sudo bash -x ./.ci/docker_clean_safe.sh
            sudo rm -rf /usr/local/lib/android
            df -h

      - name: build
        run: |
          timeout -v 20m sudo su naemon -c 'eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib) && cp t/ci/thruk_local.conf . && touch .author && ./configure && make config subdirs linkext'

      - name: run ${{ matrix.scenario }}
        run: |
          timeout -v 90m sudo su naemon -c 'eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib) && TEST_AUTHOR=1 THRUK_TEST_E2E=1 HARNESS_IS_VERBOSE=1 PERL_DL_NONLAZY=1 PERL5LIB=.:lib:$PERL5LIB env -u LD_PRELOAD perl t/610-scenario-${{ matrix.scenario }}.t'
